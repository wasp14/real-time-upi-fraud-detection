name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:

    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env:
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: fraud_db
      POSTGRES_USER: fraud_user
      POSTGRES_PASSWORD: fraud_password
      PROMETHEUS_PORT: 8001
      MODEL_DIR: ml/models

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest -v

      - name: Build Docker image
        run: |
          docker build -t fraud-detector .   

      - name: Login to Azure     
        uses: azure/login@v2
        with:
          client-id: ${{secrets.AZURE_CLIENT_ID}}
          tenant-id: ${{secrets.AZURE_TENANT_ID}}
          subscription-id: ${{secrets.AZURE_SUBSCRIPTION_ID}}
      
      - name: Login to Azure Container Registry
        run: |
          az acr login --name frauddetectorregistryandimages

      - name: Tag Docker image
        run: |
          docker tag fraud-detector \
            frauddetectorregistryandimages.azurecr.io/fraud-detector:${{ github.sha }}   

      - name: Push Docker image
        run: |
          docker push \
            frauddetectorregistryandimages.azurecr.io/fraud-detector:${{ github.sha }}
  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:

      - name: Deploy to Azure VM
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}

          script: |
            cd ~/fraud_detector

            az login --identity

            az acr login --name frauddetectorregistryandimages

            export IMAGE_TAG=${{ github.sha }}

            docker pull frauddetectorregistryandimages.azurecr.io/fraud-detector:$IMAGE_TAG

            docker compose -f docker-compose.azure.yml up -d