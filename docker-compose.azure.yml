services:

  kafka:
    image: apache/kafka:4.1.0
    container_name: kafka
    hostname: kafka
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 15s
      retries: 10
      start_period: 20s
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  redis:
    image: redis:7-alpine
    container_name: redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  feature_service:
    image: frauddetectorregistryandimages.azurecr.io/fraud-detector:${IMAGE_TAG}
    container_name: feature_service
    env_file:
      - .env.azure
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
    command: python -m feature_service.main
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  producer:
    image: frauddetectorregistryandimages.azurecr.io/fraud-detector:${IMAGE_TAG}
    container_name: producer
    env_file:
      - .env.azure
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    command: python -m producer.main
    depends_on:
      kafka:
        condition: service_healthy

  storage_service:
    image: frauddetectorregistryandimages.azurecr.io/fraud-detector:${IMAGE_TAG}
    container_name: storage_service
    env_file:
      - .env.azure
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      
    command: python3 -m storage_service.main
    depends_on:
      kafka:
        condition: service_healthy

  inference_service:
    image: frauddetectorregistryandimages.azurecr.io/fraud-detector:${IMAGE_TAG}
    container_name: inference_service
    env_file:
      - .env.azure
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    command: python3 -m inference_service.main
    depends_on:
      kafka:
        condition: service_healthy

  alert_consumer_service:
    image: frauddetectorregistryandimages.azurecr.io/fraud-detector:${IMAGE_TAG}
    container_name: alert_consumer_service
    env_file:
      - .env.azure
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    command: python3 -m inference_service.alert_consumer
    depends_on:
      kafka:
        condition: service_healthy